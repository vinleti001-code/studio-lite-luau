name: Build Android .so

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        arch: [arm64, x86_64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Show available NDK versions
        run: ls "$ANDROID_HOME/ndk" || true

      - name: Build with SCons
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          echo "Using NDK at: $ANDROID_NDK_ROOT"
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} -j$(nproc)

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libluauext-android-${{ matrix.arch }}-${{ matrix.target }}
          path: bin/lib/*.so
          if-no-files-found: error
